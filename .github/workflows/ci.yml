name: Build

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Package app
        run: |
          ./scripts/build-app.sh
          ditto -c -k --keepParent "build/Piano Tutor.app" "build/PianoTutor.zip"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: PianoTutor-app
          path: build/PianoTutor.zip
          retention-days: 14
