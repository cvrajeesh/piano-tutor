name: Build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Package app
        run: |
          ./scripts/build-app.sh
          ditto -c -k --keepParent "build/Middle C.app" "build/MiddleC.zip"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: MiddleC-app
          path: build/MiddleC.zip
          retention-days: 14

  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          which xcodegen || brew install xcodegen
          xcodegen generate

      - name: Build for the iOS Simulator
        run: |
          xcodebuild build \
            -project PianoTutor.xcodeproj \
            -scheme PianoTutor-iOS \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build the Mac App Store target
        run: |
          xcodebuild build \
            -project PianoTutor.xcodeproj \
            -scheme PianoTutor-macOS \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
