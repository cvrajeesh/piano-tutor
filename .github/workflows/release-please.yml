name: Release Please

# On every push to main, Release Please keeps a release PR up to date: the next
# version, worked out from Conventional Commit messages, and the CHANGELOG. Merging
# that PR bumps MARKETING_VERSION in project.yml, tags vX.Y.Z and creates a GitHub
# Release. Configuration: release-please-config.json and .release-please-manifest.json.
#
# - The push that merges the release PR uploads the new version to the App Store.
#   It is not submitted for review: do that in App Store Connect, or run the Release
#   workflow by hand with lane "release" and "submit" ticked.
# - Any other push that changes the app sends a build to TestFlight.
#
# Release Please creates the tag with GITHUB_TOKEN, which does not start other
# workflows, so the uploads are called from here rather than from a tag trigger.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  changes:
    needs: release-please
    if: needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did the push change the app?
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Docs, workflows and release bookkeeping don't need a new build.
          skip='^(docs/|\.github/|.*\.md$|version\.txt$|\.release-please-manifest\.json$|release-please-config\.json$)'
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qvE "$skip"; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  testflight:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/release.yml
    with:
      lane: beta
    secrets: inherit

  app-store:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      lane: release
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
