name: Release Please

# On every push to main, Release Please keeps a release PR up to date: the next
# version, worked out from Conventional Commit messages, and the CHANGELOG. Merging
# that PR bumps MARKETING_VERSION in project.yml, tags vX.Y.Z and creates a GitHub
# Release. Configuration: release-please-config.json and .release-please-manifest.json.
#
# Only the push that merges the release PR builds the apps: both are built from the
# new tag and sent to TestFlight. Nothing is submitted for review: in App Store
# Connect, add the version, pick that build and submit it, or run the Release
# workflow by hand with lane "release" and "submit" ticked. Other pushes to main
# build nothing; run the Release workflow by hand for an extra beta.
#
# Release Please creates the tag with GITHUB_TOKEN, which does not start other
# workflows, so the upload is called from here rather than from a tag trigger.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  testflight:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      lane: beta
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
